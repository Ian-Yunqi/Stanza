<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书方</title>
<meta name="description" content="书方：按此刻心境配取一味书单处方。">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="reading-progress-track" id="reading-progress-track" aria-hidden="true">
    <div class="reading-progress-fill" id="reading-progress-fill"></div>
</div>

<!-- Whisper-Quiet Top Chrome -->
<header class="top-bar" id="top-bar">
    <div class="top-left">
        <button class="brand-mark" id="brand-home-btn" aria-label="回到书方首页">书方</button>

        <div class="dose-top-left hidden" id="dose-top-left">
            <button class="back-icon" id="nav-back" aria-label="返回首页" title="返回 (Esc)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <span class="dose-scroll-title" id="dose-scroll-title"></span>
        </div>
    </div>

    <!-- Home Top-Right: 仅两个极轻文字入口 -->
    <nav class="top-right" id="home-top-right" aria-label="主导航">
        <button class="text-link" id="btn-open-stars">心境图</button>
        <button class="text-link" id="btn-open-drawer">药匣</button>
    </nav>

    <!-- Dose Top-Right: 收藏图标 + 极简更多菜单 -->
    <div class="dose-top-actions hidden" id="dose-top-right">
        <button class="subtle-icon-btn" id="btn-bookmark" aria-label="收入药匣" title="收入药匣">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
        </button>
        <button class="subtle-icon-btn" id="btn-more-menu" aria-label="更多操作" aria-expanded="false" title="更多">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
            </svg>
        </button>

        <div class="more-menu hidden" id="more-menu" role="menu">
            <div class="menu-font-row">
                <span>字号</span>
                <div class="font-scale-group">
                    <button class="font-size-btn" data-scale="0.92">小</button>
                    <button class="font-size-btn active" data-scale="1">中</button>
                    <button class="font-size-btn" data-scale="1.12">大</button>
                </div>
            </div>
            <div class="menu-divider"></div>
            <button class="menu-item" id="menu-card"><span>生成书方笺</span></button>
            <button class="menu-item" id="menu-copy-link"><span>复制书方链接</span></button>
            <button class="menu-item" id="menu-open-drawer"><span>打开药匣与书录</span></button>
        </div>
    </div>
</header>

<main>
    <!-- ==================== HOME VIEW (一屏极致留白) ==================== -->
    <section id="home-view" class="view-container active" aria-label="书方首页">
        <button class="edge-cue edge-left" id="zone-prev" aria-label="上一味心境">〈</button>
        <button class="edge-cue edge-right" id="zone-next" aria-label="下一味心境">〉</button>

        <div class="home-core">
            <!-- 1. 中心呼吸词 + 人间词话式诗境注脚（轻点直入，无需大按钮） -->
            <div class="mirror-focus" id="zone-enter" role="button" tabindex="0" aria-label="取当前心境书方">
                <div id="emotion-display" class="emotion-word word-short">迷茫</div>
                <p id="emotion-whisper" class="emotion-whisper"></p>
                <span id="emotion-poem-source" class="emotion-poem-source"></span>
            </div>

            <!-- 2. 谷歌极简悬浮胶囊：自然语言倾诉 / 复方输入 / 搜书 -->
            <div class="search-pill-wrap">
                <div class="search-pill">
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="symptom-search"
                        class="search-input"
                        placeholder="写下此刻的状态，如“睡不着”、“内耗”或搜书名…"
                        autocomplete="off"
                        aria-label="写下此刻状态或搜索书方"
                    >
                    <button class="search-clear hidden" id="search-clear" aria-label="清空">×</button>
                </div>
                <div class="search-dropdown hidden" id="search-dropdown" role="listbox"></div>
            </div>

            <!-- 3. 无框微字心境列：悬停预览，点击入方 -->
            <div class="mood-strip" id="mood-strip" aria-label="八味心境"></div>
        </div>

        <!-- 4. 底端轻量「今日一味」 -->
        <div class="home-bottom">
            <button class="daily-link" id="btn-daily-dose">
                今日一味<span class="daily-sub" id="daily-sub"></span>
            </button>
        </div>
    </section>

    <!-- ==================== DOSE VIEW (纯纸面阅读流) ==================== -->
    <article id="dose-view" class="view-container hidden" aria-label="书方正文">
        <div id="degraded-hint" class="degraded-hint hidden">
            <span id="degraded-hint-text"></span>
            <button id="btn-reset-seen-inline">重置已服</button>
        </div>

        <header class="rx-header">
            <div class="rx-poem-epigraph hidden" id="render-poem-epigraph"></div>
            <div class="rx-meta-line">
                <span id="render-id">001</span>
                <span>·</span>
                <span id="render-read-time">约 2 分钟</span>
            </div>
            <h1 class="rx-book-title" id="render-title"></h1>
            <div class="rx-book-author" id="render-author"></div>
            <p class="rx-summary" id="render-summary"></p>
        </header>

        <section class="guide-section">
            <div class="guide-text" id="render-guide"></div>
        </section>

        <section class="quotes-section" id="render-quotes"></section>

        <section class="extras-box" id="render-extras"></section>

        <div class="end-marker">□</div>

        <footer class="footer-actions">
            <button class="action-link action-link-primary" id="nav-next">换一味 →</button>
            <button class="action-link" id="nav-home">回到首页</button>
        </footer>
    </article>
</main>

<!-- ==================== FULLSCREEN 心境图（星空 × 情绪空间） ==================== -->
<div class="star-overlay" id="star-overlay" aria-hidden="true" role="dialog" aria-label="心境图">
    <div class="star-overlay-bar">
        <span class="star-overlay-caption">心境图 · 择一词，或轻点两词之间配取复方</span>
        <button class="text-link" id="btn-close-stars">关闭</button>
    </div>

    <svg class="star-svg" id="star-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="50" y1="10" x2="50" y2="90" stroke="currentColor" stroke-opacity="0.06" stroke-width="0.2" stroke-dasharray="1 1.4"/>
        <line x1="8" y1="50" x2="92" y2="50" stroke="currentColor" stroke-opacity="0.06" stroke-width="0.2" stroke-dasharray="1 1.4"/>
    </svg>

    <span class="axis-whisper axis-top">思绪翻涌 · 渴求方向</span>
    <span class="axis-whisper axis-bottom">能量低落 · 倦怠疏离</span>
    <span class="axis-whisper axis-left">向内沉静</span>
    <span class="axis-whisper axis-right">向外躁动</span>

    <div class="star-cursor-ring" id="star-cursor-ring"></div>
    <div class="star-canvas" id="star-canvas"></div>
    <div class="star-bottom-readout" id="star-readout">轻点任意一词，或点在两词之间的留白</div>
</div>

<!-- ==================== 药匣抽屉（按需展开） ==================== -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer-sheet" id="drawer-sheet" aria-label="药匣与全部书录" aria-hidden="true">
    <div class="drawer-header">
        <h2 class="drawer-title">药匣</h2>
        <button class="text-link" id="btn-close-drawer">关闭</button>
    </div>

    <div class="drawer-tabs" role="tablist">
        <button class="drawer-tab active" data-tab="catalog" role="tab" id="tab-catalog-label">全部 (77)</button>
        <button class="drawer-tab" data-tab="saved" role="tab" id="tab-saved-label">收藏 (0)</button>
        <button class="drawer-tab" data-tab="history" role="tab" id="tab-history-label">足迹 (0)</button>
    </div>

    <div class="drawer-search-bar" id="drawer-search-bar">
        <input type="text" class="drawer-search-input" id="drawer-search" placeholder="筛选书名、作者或心境…">
    </div>

    <div class="drawer-body" id="drawer-body"></div>

    <div class="drawer-footer">
        <span id="drawer-progress-text">已服 0 / 77 味</span>
        <button class="whisper-action" id="btn-clear-seen">重置推荐去重</button>
    </div>
</aside>

<!-- ==================== 书方笺 MODAL ==================== -->
<div class="modal-backdrop" id="card-modal-backdrop" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-label="书方笺">
        <div class="modal-header">
            <h3 class="modal-title">书方笺</h3>
            <button class="text-link" id="btn-close-card-modal">关闭</button>
        </div>

        <div class="card-preview-wrap">
            <canvas id="share-card-canvas" width="900" height="1260"></canvas>
        </div>

        <div class="card-controls">
            <div class="paper-links" id="card-theme-pills">
                <button class="paper-link active" data-paper="paper">素纸</button>
                <button class="paper-link" data-paper="warm">暖笺</button>
                <button class="paper-link" data-paper="ink">墨夜</button>
            </div>
            <button class="whisper-action" id="btn-switch-card-quote">换一句摘录</button>
        </div>

        <div class="modal-footer">
            <button class="text-link" id="btn-cancel-card">取消</button>
            <button class="text-link" style="color:var(--text);" id="btn-download-card">保存图片</button>
        </div>
    </div>
</div>

<!-- ==================== 诗引过场（先出诗句，再展书方） ==================== -->
<div class="poem-interlude" id="poem-interlude" aria-hidden="true">
    <div class="poem-interlude-mood" id="interlude-mood"></div>
    <div class="poem-interlude-verse" id="interlude-verse"></div>
    <div class="poem-interlude-source" id="interlude-source"></div>
    <div class="poem-interlude-skip">轻触任意处即刻入方</div>
</div>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<script src="./books.js"></script>
<script src="./app.js"></script>
</body>
</html>
